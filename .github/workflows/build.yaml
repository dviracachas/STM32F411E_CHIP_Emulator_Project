name: Build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [Simple_LED_blink, Simple_button_LED, Simple_UART]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi binutils-arm-none-eabi make
      - name: Build
        run: make -C projects/${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}
          path: |
            projects/${{ matrix.project }}/build/*.bin
            projects/${{ matrix.project }}/build/*.elf
          if-no-files-found: error

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          make check-format
